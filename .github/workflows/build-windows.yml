name: Build Windows exe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      # The project's own fonts, which its official release embeds (same pinned commit).
      - name: Check out craft-fonts
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: 3d9ab3a132ed0eff457e424226a435a901da30d3
          path: craft-fonts

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Built the way the official release builds it: locked dependencies, fonts embedded.
      - name: Build release
        shell: pwsh
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: cargo build --release --locked -p pdfcraft

      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/pdfcraft.exe dist/
          Copy-Item LICENSE-APACHE, LICENSE-MIT, NOTICE dist/ -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: pdfcraft-windows-x64
          path: dist/

      # Pictures of the real app (software rendering), so the new features can be checked
      # without a screen. A failure here never affects the exe above.
      - name: Screenshots of the app
        continue-on-error: true
        shell: pwsh
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          # A one-page test PDF whose text runs almost to the left and right edges, like a slide
          # handout, to check that paper view never cuts words off.
          $stream = "BT /F1 20 Tf 8 760 Td (Edge text begins at the very left of the page) Tj ET`nBT /F1 20 Tf 8 640 Td (A second long line that nearly touches the right edge too) Tj ET`nBT /F1 14 Tf 8 520 Td (Small text near the left edge for checking that nothing is cut) Tj ET"
          $bodies = @(
            "<< /Type /Catalog /Pages 2 0 R >>",
            "<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
            "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Contents 4 0 R /Resources << /Font << /F1 5 0 R >> >> >>",
            "<< /Length $($stream.Length) >>`nstream`n$stream`nendstream",
            "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>"
          )
          $sb = New-Object System.Text.StringBuilder
          [void]$sb.Append("%PDF-1.4`n")
          $offsets = @()
          for ($i = 0; $i -lt $bodies.Count; $i++) { $offsets += $sb.Length; [void]$sb.Append("$($i + 1) 0 obj`n$($bodies[$i])`nendobj`n") }
          $xref = $sb.Length
          [void]$sb.Append("xref`n0 6`n0000000000 65535 f `n")
          foreach ($o in $offsets) { [void]$sb.Append(("{0:D10} 00000 n `n" -f $o)) }
          [void]$sb.Append("trailer`n<< /Size 6 /Root 1 0 R >>`nstartxref`n$xref`n%%EOF`n")
          [IO.File]::WriteAllText("$PWD/shots/sample.pdf", $sb.ToString(), [Text.Encoding]::ASCII)
          $pdf = "shots/sample.pdf"
          cargo run --release --locked -p pdfcraft-ui-egui --example shot -- shots/1-window-dark.png $pdf --size 1440x900 --scale 1 --mode read
          cargo run --release --locked -p pdfcraft-ui-egui --example shot -- shots/2-window-light-pages.png $pdf --size 1440x900 --scale 1 --mode read --dark_pages off
          cargo run --release --locked -p pdfcraft-ui-egui --example shot -- shots/3-paper-portrait.png $pdf --size 1080x1920 --scale 1 --full_screen on --dark_pages off
          cargo run --release --locked -p pdfcraft-ui-egui --example shot -- shots/4-short-window.png $pdf --size 1280x600 --scale 1 --mode read
          cargo run --release --locked -p pdfcraft-ui-egui --example shot -- shots/5-paper-landscape.png $pdf --size 1600x900 --scale 1 --full_screen on

      - name: Publish screenshots to a branch
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          if (-not (Test-Path shots)) { exit 0 }
          Copy-Item shots "$env:RUNNER_TEMP/shots" -Recurse -Force
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan ui-shots
          git rm -rf . | Out-Null
          Copy-Item "$env:RUNNER_TEMP/shots" shots -Recurse -Force
          git add shots
          git commit -m "UI screenshots from run ${{ github.run_number }}"
          git push -f origin ui-shots
